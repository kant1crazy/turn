<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Éditeur Sarments</title>
<style>
/* Interface : un atelier sombre, pour que les pages blanches du dossier ressortent.
   Accent = le bleu des poignées de sélection du dossier. Thème unique, sombre, assumé. */
:root {
  color-scheme: dark;
  --bg: #0E0E0D; --bg2: #141413; --panel: #191918; --panel2: #201F1D; --line: #2B2A27; --line2: #383632;
  --tx: #ECE9E2; --mut: #A29E95; --dim: #6E6A62; --acc: #1E8FF2; --acc2: #56ABF5; --accS: rgba(30,143,242,.16);
  --sel: #BCDBEF; --danger: #E5584F; --ok: #5FBF83; --warn: #E7A83E;
  --f-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-doc: 'Crimson Pro', Georgia, serif;
  --r: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 400 13px/1.4 var(--f-ui); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr) 300px; grid-template-rows: 54px minmax(0, 1fr); }

/* --- barre du haut */
#top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 12px 0 14px;
  background: var(--bg2); border-bottom: 1px solid var(--line); min-width: 0; }
.t-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.logo { position: relative; display: grid; place-items: center; width: 30px; height: 30px; font: 600 19px/1 var(--f-doc); color: #141414; background: var(--sel); flex: none; }
.logo::before, .logo::after { content: ""; position: absolute; width: 2px; background: var(--acc); }
.logo::before { left: -1px; top: -4px; bottom: 0; } .logo::after { right: -1px; top: 0; bottom: -4px; }
.logo i::before, .logo i::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.logo i::before { left: -4px; top: -6px; } .logo i::after { right: -4px; bottom: -6px; }
.t-title { display: flex; flex-direction: column; min-width: 0; }
#ptitle { background: transparent; border: 0; color: var(--tx); font: 600 14px/1.2 var(--f-ui); padding: 2px 4px; margin-left: -4px; border-radius: 4px; width: min(320px, 100%); }
#ptitle:hover { background: var(--panel2); }
.savest { font-size: 11.5px; color: var(--mut); padding-left: 0; display: inline-flex; align-items: center; gap: 6px; }
.savest::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.savest.s-dirty::before, .savest.s-saving::before { background: var(--warn); }
.savest.s-error::before, .savest.s-mem::before { background: var(--danger); }
.savest.s-readonly::before { background: var(--dim); }
.t-mid { display: flex; align-items: center; gap: 4px; }
.t-right { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
.sep { width: 1px; height: 22px; background: var(--line2); margin: 0 6px; }
.ib { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--tx); cursor: pointer; font-size: 16px; }
.ib:hover { background: var(--panel2); }
.ib:disabled { opacity: .35; cursor: default; background: transparent; }
.ib.tog.on { background: var(--accS); color: var(--acc2); }
.zlab { min-width: 74px; height: 32px; border: 0; border-radius: 6px; background: var(--panel2); color: var(--tx); cursor: pointer; font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line2);
  background: var(--panel2); color: var(--tx); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: #4A4741; background: #262522; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.primary:hover { background: #3A9CF4; }
.btn.ghost { background: transparent; }
.btn.danger { color: #F08A82; }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.big { height: 44px; padding: 0 20px; font-size: 14.5px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }

/* --- liste des pages */
#left { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.l-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 8px; font-weight: 600; letter-spacing: .02em; }
#pcount { color: var(--mut); font-weight: 400; font-variant-numeric: tabular-nums; }
#plist { position: relative; flex: 1; overflow-y: auto; padding: 0 10px 20px; scrollbar-width: thin; scrollbar-color: #3a3833 transparent; }
.chap { display: flex; gap: 8px; align-items: baseline; margin: 16px 6px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
.chap-n { color: var(--acc2); font-variant-numeric: tabular-nums; }
.pitem { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; padding: 6px; border-radius: 8px; cursor: pointer; user-select: none; }
.pitem:hover { background: var(--panel); }
.pitem.cur { background: var(--panel2); }
.pitem.cur .pthumb { outline: 2px solid var(--acc); outline-offset: 1px; }
.pnum { grid-row: 1 / span 2; font-size: 11px; color: var(--dim); padding-top: 2px; font-variant-numeric: tabular-nums; }
.pitem.cur .pnum { color: var(--acc2); }
.pthumb { position: relative; width: 196px; height: 138.6px; overflow: hidden; background: #fff; border-radius: 2px; box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 2px 8px rgba(0,0,0,.35); }
.tscale { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(.116667); pointer-events: none; }
.pname { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 4px 2px 0; }
.pn-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--tx); }
.pn-b { font-size: 10.5px; color: var(--dim); }
.pacts { position: absolute; right: 10px; top: 10px; display: none; gap: 4px; }
.pitem:hover .pacts { display: flex; }
.mini { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line2); background: rgba(20,20,19,.88); color: var(--tx); cursor: pointer; }
.mini:hover { border-color: var(--acc); }
.mini.danger:hover { border-color: var(--danger); color: #F08A82; }
.dropline { position: absolute; left: 10px; right: 10px; height: 3px; border-radius: 3px; background: var(--acc); pointer-events: none; z-index: 5; }
body.dragging-page, body.dragging-page * { cursor: grabbing !important; }
.l-foot { padding: 10px 12px 14px; border-top: 1px solid var(--line); }

/* --- scène */
#stage { position: relative; min-width: 0; min-height: 0; background: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, #1c1c1a 1px, transparent 1.3px); background-size: 22px 22px; }
#viewport { position: absolute; inset: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #3a3833 transparent; }
#viewport.pen, #viewport.pen * { cursor: crosshair !important; }
#viewport.dropping #pframe { outline: 3px dashed var(--acc); outline-offset: 6px; }
#board { position: relative; }
#pframe { position: absolute; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4); }
#phost { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#ov { position: absolute; left: 0; top: 0; pointer-events: none; }
.pg.mode-edit .el.locked { cursor: default; }
.pg.mode-edit .el.empty .ph { cursor: copy; }
.pg .el.editing .tx { user-select: text; -webkit-user-select: text; cursor: text; outline: none; caret-color: var(--acc); }
.selbox { position: absolute; border: 1.5px solid var(--acc); pointer-events: none; transform-origin: 50% 50%; }
.selbox.locked { border-style: dashed; border-color: #8FB8DD; }
.selbox.editing { border-color: rgba(30,143,242,.55); border-style: dashed; }
.hd { position: absolute; width: 11px; height: 11px; background: #fff; border: 1.5px solid var(--acc); border-radius: 2px; pointer-events: auto; transform: translate(-50%, -50%); }
.hd-nw { left: 0; top: 0; cursor: nwse-resize; } .hd-n { left: 50%; top: 0; cursor: ns-resize; } .hd-ne { left: 100%; top: 0; cursor: nesw-resize; }
.hd-e { left: 100%; top: 50%; cursor: ew-resize; } .hd-se { left: 100%; top: 100%; cursor: nwse-resize; } .hd-s { left: 50%; top: 100%; cursor: ns-resize; }
.hd-sw { left: 0; top: 100%; cursor: nesw-resize; } .hd-w { left: 0; top: 50%; cursor: ew-resize; }
.rot { position: absolute; left: 50%; top: -30px; width: 13px; height: 13px; border-radius: 50%; background: var(--acc); border: 2px solid #fff; transform: translateX(-50%); pointer-events: auto; cursor: grab; }
.rot::after { content: ""; position: absolute; left: 50%; top: 11px; width: 1.5px; height: 17px; background: var(--acc); transform: translateX(-50%); }
.dim { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); background: var(--acc); color: #fff; font-size: 10.5px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lockb { position: absolute; right: -9px; top: -9px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: #2A3B4C; color: #fff; }
.hoverbox { position: absolute; border: 1px solid rgba(30,143,242,.7); pointer-events: none; transform-origin: 50% 50%; }
.marquee { position: absolute; border: 1px solid var(--acc); background: rgba(30,143,242,.1); }
.guide { position: absolute; background: #FF3E8A; }
.guide.v { top: 0; bottom: 0; width: 1px; } .guide.h { left: 0; right: 0; height: 1px; }
.gridov { position: absolute; inset: 0; }
.gridov i { position: absolute; top: 0; bottom: 0; background: rgba(255, 62, 138, .07); border-left: 1px solid rgba(255,62,138,.18); border-right: 1px solid rgba(255,62,138,.18); }
.gridov b { position: absolute; border: 1px dashed rgba(30,143,242,.6); }
.penlive { position: absolute; inset: 0; }
.cropwrap { position: absolute; transform-origin: 50% 50%; pointer-events: auto; cursor: move; }
.cropghost { position: absolute; background-size: 100% 100%; opacity: .38; outline: 1px dashed rgba(255,255,255,.7); }
.cropframe { position: absolute; inset: 0; border: 2px solid var(--acc); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
#pinfo { position: absolute; left: 14px; bottom: 14px; font-size: 11.5px; color: var(--mut); pointer-events: none; }

/* --- barre d'outils */
#toolbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 5px;
  background: rgba(27,27,25,.94); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.5); backdrop-filter: blur(8px); z-index: 5; max-width: calc(100% - 24px); overflow-x: auto; }
.tb { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: var(--tx); cursor: pointer; flex: none; }
.tb:hover { background: #2A2926; }
.tb.on { background: var(--acc); color: #fff; }
.tsep { width: 1px; height: 24px; background: var(--line2); margin: 0 4px; flex: none; }
.floatbar { position: absolute; display: flex; align-items: center; gap: 4px; padding: 5px; background: rgba(27,27,25,.97); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.5); z-index: 6; }
#cropbar { left: 50%; top: 14px; transform: translateX(-50%); gap: 10px; padding: 6px 8px 6px 12px; }
.fb-l { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.fb-r { display: inline-flex; align-items: center; gap: 8px; color: var(--mut); }
.fb-hint { color: var(--dim); font-size: 11.5px; padding: 0 6px; }
input[type=range] { accent-color: var(--acc); width: 130px; }

/* --- inspecteur */
#right { background: var(--bg2); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #3a3833 transparent; }
#insp { padding: 12px 14px 40px; }
.ihead { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 12px; border-bottom: 1px solid var(--line); }
.ikind { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--acc2); }
.ititle { font: 500 15px/1.3 var(--f-doc); font-size: 17px; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.isec { padding: 14px 0 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.isec:last-child { border-bottom: 0; }
.isec h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
.irow { display: grid; grid-template-columns: 68px minmax(0, 1fr); align-items: center; gap: 8px; }
.ilab { color: var(--mut); font-size: 12px; }
.ictl { min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.grid2 .irow { grid-template-columns: 42px minmax(0, 1fr); }
.num { display: flex; align-items: center; height: 30px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); padding: 0 8px 0 0; min-width: 0; width: 100%; }
.num input { width: 100%; min-width: 0; background: transparent; border: 0; color: var(--tx); font: inherit; padding: 0 0 0 8px; height: 100%; font-variant-numeric: tabular-nums; }
.num input { -moz-appearance: textfield; appearance: textfield; }
.num input::-webkit-inner-spin-button, .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.num .u { color: var(--dim); font-size: 11px; }
.num.dis { opacity: .45; }
select, .txtin, textarea { width: 100%; height: 30px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); color: var(--tx); font: inherit; padding: 0 8px; }
textarea { height: auto; padding: 8px; resize: vertical; line-height: 1.45; }
.txtin.small { width: 92px; flex: 1; }
.segs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--panel); border: 1px solid var(--line2); border-radius: 7px; padding: 2px; }
.seg { border: 0; background: transparent; color: var(--mut); padding: 4px 7px; min-height: 26px; border-radius: 5px; cursor: pointer; display: inline-grid; place-items: center; font-size: 12px; }
.seg:hover { color: var(--tx); background: #262522; }
.seg.on { background: #33312D; color: var(--tx); box-shadow: inset 0 0 0 1px #4b4842; }
.seg:disabled { opacity: .5; cursor: default; }
.switch { position: relative; width: 36px; height: 20px; border-radius: 20px; border: 0; background: #3A3833; cursor: pointer; flex: none; padding: 0; }
.switch i { position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #CFCBC3; transition: transform .15s; }
.switch.on { background: var(--acc); }
.switch.on i { transform: translateX(16px); background: #fff; }
.flexrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mini-l { color: var(--mut); font-size: 12px; }
.sws { display: flex; flex-wrap: wrap; gap: 5px; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); cursor: pointer; padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--acc); }
.sw.none { background: linear-gradient(135deg, transparent 45%, #E5584F 45%, #E5584F 55%, transparent 55%), #2a2926 !important; }
.sws input[type=color] { width: 24px; height: 22px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.ibtns { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { margin: 0; color: var(--dim); font-size: 11.5px; line-height: 1.45; }
.ro { margin: 0 0 8px; padding: 8px 10px; border-radius: 6px; background: #2A2620; color: #E9C98C; font-size: 12px; }
.layers { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.layer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 6px 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.layer:hover { background: var(--panel); }
.layer.locked .lt { color: var(--mut); }
.lt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segrows { display: flex; flex-direction: column; gap: 6px; }
.segrow { display: flex; gap: 6px; align-items: center; }
.segrow .num { width: 74px; flex: none; }
.segrow input[type=color] { width: 30px; height: 28px; border: 0; background: transparent; padding: 0; }

/* --- fenêtres */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); padding: 24px; opacity: 0; transition: opacity .18s; }
#modal.in { opacity: 1; }
.mcard { position: relative; width: min(560px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 26px 26px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.mcard.wide { width: min(1080px, 100%); }
.mcard.small { width: min(440px, 100%); }
.mcard.export { width: min(620px, 100%); }
.mcard h2 { margin: 0 0 6px; font: 500 28px/1.15 var(--f-doc); letter-spacing: -.005em; }
.msub { margin: 0 0 18px; color: var(--mut); line-height: 1.5; }
.mclose { position: absolute; right: 12px; top: 12px; }
.mbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.confirm p { color: var(--mut); margin: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
.lcard { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); cursor: pointer; text-align: left; }
.lcard:hover { border-color: var(--acc); }
.lthumb { position: relative; width: 100%; aspect-ratio: 1680 / 1188; overflow: hidden; background: #fff; border-radius: 3px; }
.lthumb .tscale { transform: scale(.1066); }
.menu { position: fixed; z-index: 60; width: 280px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.55); display: flex; flex-direction: column; }
.menu button { text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--panel2); }
.menu-note { margin: 6px 4px 4px; padding: 8px 6px 2px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; line-height: 1.45; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 10px 0 0; }
.keys dt { font-weight: 600; color: var(--tx); white-space: nowrap; }
.keys dd { margin: 0; color: var(--mut); }
.xp .xrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 14px; }
.xp .xrow.top { align-items: start; }
.xp .xrow > :nth-child(3) { grid-column: 2; }
.qcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qcard { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; padding: 10px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel2); cursor: pointer; }
.qcard b { font-size: 14px; } .qcard span { color: var(--acc2); font-size: 12px; font-variant-numeric: tabular-nums; } .qcard em { font-style: normal; color: var(--dim); font-size: 11.5px; line-height: 1.35; }
.qcard.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.xbar { height: 6px; border-radius: 6px; background: #2C2B28; overflow: hidden; margin: 18px 0 10px; }
.xbar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .25s; }
.xlab { color: var(--mut); margin: 0; font-variant-numeric: tabular-nums; }

/* --- notifications */
#toasts { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 70; pointer-events: none; }
.toast { padding: 10px 16px; border-radius: 9px; background: #F2EFE9; color: #151515; font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.45); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; max-width: 520px; text-align: center; }
.toast.in { opacity: 1; transform: none; }
.toast.warn { background: #F6DFC2; }
.toast.busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; border: 2px solid #151515; border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* --- accueil */
#onboard { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); overflow-y: auto; padding: 24px;
  background-image: radial-gradient(1200px 600px at 70% 120%, rgba(30,143,242,.10), transparent 60%), radial-gradient(circle at 1px 1px, #1a1a18 1px, transparent 1.3px);
  background-size: auto, 22px 22px; }
.ob-in { width: min(860px, 100%); }
.ob-k { margin: 0 0 18px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
.ob-t { margin: 0; font: 400 clamp(64px, 12vw, 150px)/1 var(--f-doc); letter-spacing: .03em; text-transform: uppercase; }
.ob-mark { position: relative; display: inline-block; padding: 0 .1em; color: #141414; background-image: linear-gradient(var(--sel), var(--sel)); background-repeat: no-repeat; background-size: 0% 100%;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {

    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');

  const n = parseInt(m[1], 16);

}

  if (!s) return null;
  if (s[0] === '#') { const [r, g, b] = hexToRgb(s); return [r, g, b, 1]; }
  const m = /rgba?\(([^)]+)\)/.exec(s);
  if (!m) return null;
  const p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
  return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
}

   dans le navigateur (IndexedDB). Même interface pour les deux.

const CAP = { db: null, assets: null, downloads: null, user: null };

function withTimeout(p, ms) {
  return Promise.race([Promise.resolve(p).catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
}

async function pickBackend() {
  const cl = window.claude;
  if (cl && typeof cl.use === 'function') {
    const [db, assets, downloads, user] = await Promise.all([
      withTimeout(cl.use('db'), 9000), withTimeout(cl.use('assets'), 9000),
      withTimeout(cl.use('downloads'), 9000), withTimeout(cl.use('user'), 9000)
    ]);
    Object.assign(CAP, { db, assets, downloads, user });
    if (db) {
      let canWrite = !!assets;
      try {
        if (user && typeof user.can === 'function') {
          const c = await user.can('data.write');
          if (c === false) canWrite = false;
        }
      } catch (e) { /* on garde la valeur par défaut */ }
      return makeCloud(db, assets, canWrite);
    }
  }
  try { return await makeLocal(); } catch (e) { return makeMemory(); }
}

/* ------------------------------------------------------------ en ligne */
function makeCloud(db, assets, canWrite) {
  const be = {
    kind: 'cloud', canWrite,
    label: canWrite ? 'Enregistré en ligne' : 'Lecture seule',
    async loadAll() {
      const m = await db.doc('meta/project').get();
      const qs = await db.collection('pages').get();
      return {
        meta: m.exists ? clone(m.data()) : null,
        pages: qs.docs.filter(d => d.exists).map(d => clone(d.data()))
      };
    },
    subscribe(onMeta, onPage, onRemove) {
      try {
        db.doc('meta/project').onSnapshot(s => {
          if (s.metadata && s.metadata.hasPendingWrites) return;
          if (s.exists) onMeta(clone(s.data()));
        }, () => {});
        db.collection('pages').onSnapshot(qs => {
          for (const ch of qs.docChanges()) {
            if (ch.doc.metadata && ch.doc.metadata.hasPendingWrites) continue;
            if (ch.type === 'removed') onRemove(ch.doc.id);
            else onPage(clone(ch.doc.data()));
          }
        }, () => {});
      } catch (e) { /* les mises à jour en direct sont un bonus */ }
    },
    savePage: p => db.doc('pages/' + p.id).set(p),
    deletePage: id => db.doc('pages/' + id).delete(),
    saveMeta: m => db.doc('meta/project').set(m),
    async putBlob(blob, type) {
      if (!assets) throw { code: 'not_granted', message: 'Ajout de fichiers indisponible dans cette vue.' };
      const r = await assets.upload(blob, type ? { type } : undefined);
      return 'asset:' + r.id;
    },
    url(ref) {
      if (!ref) return '';
      if (ref.startsWith('asset:')) return '/_blob/' + ref.slice(6);
      return ref;
    }
  };
  return be;
}

/* ------------------------------------------------------------ navigateur (IndexedDB) */
function idbReq(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function makeLocal() {
  if (!window.indexedDB) throw new Error('no idb');
  const open = indexedDB.open('sarments-editeur', 1);
  open.onupgradeneeded = () => {
    const d = open.result;
    if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs');
    if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
  };
  const idb = await idbReq(open);
  const tx = (store, mode = 'readonly') => idb.transaction(store, mode).objectStore(store);
  const urls = {};
  // les images sont gardées en Blob : on prépare leurs adresses locales
  await new Promise((res) => {
    const cur = tx('blobs').openCursor();
    cur.onsuccess = () => {
      const c = cur.result;
      if (!c) return res();
      urls[c.key] = URL.createObjectURL(c.value);
      c.continue();
    };
    cur.onerror = () => res();
  });
  return {
    kind: 'local', canWrite: true, label: 'Enregistré dans ce navigateur',
    async loadAll() {
      const meta = await idbReq(tx('docs').get('meta'));
      const all = await idbReq(tx('docs').getAll());
      const keys = await idbReq(tx('docs').getAllKeys());
      const pages = [];
      keys.forEach((k, i) => { if (String(k).startsWith('page:')) pages.push(all[i]); });
      return { meta: meta || null, pages };
    },
    subscribe() {},
    savePage: p => idbReq(tx('docs', 'readwrite').put(p, 'page:' + p.id)),
    deletePage: id => idbReq(tx('docs', 'readwrite').delete('page:' + id)),
    saveMeta: m => idbReq(tx('docs', 'readwrite').put(m, 'meta')),
    async putBlob(blob) {
      const key = uid('b');
      await idbReq(tx('blobs', 'readwrite').put(blob, key));
      urls[key] = URL.createObjectURL(blob);
      return 'idb:' + key;
    },
    url(ref) {
      if (!ref) return '';
      if (ref.startsWith('idb:')) return urls[ref.slice(4)] || '';
      return ref;
    }
  };
}

function makeMemory() {
  const docs = {}, urls = {};
  return {
    kind: 'memory', canWrite: true, label: 'Non enregistré',
    async loadAll() { return { meta: null, pages: [] }; },
    subscribe() {},
    async savePage(p) { docs[p.id] = p; },
    async deletePage(id) { delete docs[id]; },
    async saveMeta() {},
    async putBlob(blob) { const k = uid('m'); urls[k] = URL.createObjectURL(blob); return 'mem:' + k; },
    url(ref) { return ref && ref.startsWith('mem:') ? urls[ref.slice(4)] || '' : (ref || ''); }
  };
}

/* ------------------------------------------------------------ file d'enregistrement
   Une écriture à la fois, regroupée après une courte pause. */
const SAVE = { pages: new Set(), meta: false, timer: null, busy: false, lastLocal: {}, failures: 0 };
function markDirty(pid) {
  if (!S.backend || !S.backend.canWrite) return;
  SAVE.pages.add(pid);
  SAVE.lastLocal[pid] = Date.now();
  scheduleSave();
}
function markMeta() {
  if (!S.backend || !S.backend.canWrite) return;
  SAVE.meta = true;
  scheduleSave();
}
function scheduleSave(delay = 800) {
  setSaveState('dirty');
  clearTimeout(SAVE.timer);
  SAVE.timer = setTimeout(flushSave, delay);
}
function cleanPage(p) {
  const c = clone(p);
  for (const el of c.els) { delete el._h; }
  c.updatedAt = Date.now();
  return c;
}
async function flushSave() {
  if (SAVE.busy) { scheduleSave(400); return; }
  if (!SAVE.pages.size && !SAVE.meta) { setSaveState('saved'); return; }
  SAVE.busy = true;
  setSaveState('saving');
  const ids = [...SAVE.pages];
  SAVE.pages.clear();
  const doMeta = SAVE.meta;
  SAVE.meta = false;
  try {
    for (const id of ids) {
      const p = S.pages.get(id);
      if (p) await S.backend.savePage(cleanPage(p));
    }
    if (doMeta) await S.backend.saveMeta(clone(S.meta));
    SAVE.failures = 0;
    setSaveState(SAVE.pages.size || SAVE.meta ? 'dirty' : 'saved');
  } catch (e) {
    ids.forEach(id => SAVE.pages.add(id));
    if (doMeta) SAVE.meta = true;
    SAVE.failures++;
    const code = e && e.code;
    if (code === 'invalid_argument' && SAVE.failures > 1) {
      S.backend.canWrite = false;
      setSaveState('readonly');
      toast('Cette vue est en lecture seule : tes modifications ne sont pas enregistrées.', 'warn', 6000);
    } else if (code === 'quota_exceeded') {
      setSaveState('error', 'Espace plein');
      toast('Espace de stockage plein : supprime des pages ou des images inutilisées.', 'warn', 6000);
    } else {
      setSaveState('error', 'Nouvel essai…');
      if (SAVE.failures < 6) setTimeout(() => scheduleSave(0), 1500 * SAVE.failures);
    }
  } finally {
    SAVE.busy = false;
    if ((SAVE.pages.size || SAVE.meta) && SAVE.failures === 0) scheduleSave(300);
  }
}
async function deletePageNow(id) {
  SAVE.pages.delete(id);
  try { await S.backend.deletePage(id); } catch (e) { /* la page disparaîtra de l'ordre de toute façon */ }
}

/* ------------------------------------------------------------ fichiers importés */
const MAX_IMG = 3000;
async function imageHasAlpha(bmp) {
  const c = document.createElement('canvas');
  c.width = 48; c.height = 48;
  const x = c.getContext('2d');
  x.drawImage(bmp, 0, 0, 48, 48);
  const d = x.getImageData(0, 0, 48, 48).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  return false;
}
async function prepareImage(file) {
  if (/heic|heif/i.test(file.type) || /\.(heic|heif)$/i.test(file.name || '')) {
    throw { message: 'Format HEIC non pris en charge : exporte la photo en JPEG depuis ton téléphone.' };
  }
  if (file.type === 'image/svg+xml') {
    const url = URL.createObjectURL(file);
    const img = await loadImg(url);
    return { blob: file, w: img.naturalWidth || 1000, h: img.naturalHeight || 1000, type: 'image/svg+xml' };
  }
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await createImageBitmap(file); }
  const w0 = bmp.width, h0 = bmp.height;
  const k = Math.min(1, MAX_IMG / Math.max(w0, h0));
  const alpha = /png|webp|gif/.test(file.type) ? await imageHasAlpha(bmp) : false;
  if (k === 1 && file.type === 'image/jpeg' && file.size < 2.6e6) return { blob: file, w: w0, h: h0, type: 'image/jpeg' };
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(bmp, 0, 0, c.width, c.height);
  const type = alpha ? 'image/webp' : 'image/jpeg';
  const blob = await new Promise(r => c.toBlob(r, type, alpha ? 0.92 : 0.88));
  return { blob, w: c.width, h: c.height, type: blob.type || type };
}
function loadImg(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.decoding = 'async';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Image illisible'));
    i.src = url;
  });
}
async function videoPoster(file) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('Vidéo illisible')); setTimeout(res, 6000); });
  try { v.currentTime = Math.min(0.6, (v.duration || 1) / 3); await new Promise(r => { v.onseeked = r; setTimeout(r, 2500); }); } catch (e) {}
  const w = v.videoWidth || 1280, hh = v.videoHeight || 720;
  const k = Math.min(1, 2200 / Math.max(w, hh));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(hh * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  URL.revokeObjectURL(url);
  return { blob, w, h: hh };
}
async function ingestFile(file) {
  if (!S.backend.canWrite) throw { message: 'Lecture seule : ajout impossible.' };
  if (file.type.startsWith('image/') || /\.(heic|heif)$/i.test(file.name || '')) {
    const p = await prepareImage(file);
    const ref = await S.backend.putBlob(p.blob, p.type);
    return { kind: 'image', ref, w: p.w, h: p.h };
  }
  if (file.type.startsWith('video/')) {
    if (!/mp4|webm/.test(file.type)) throw { message: 'Vidéo : utilise un fichier MP4 ou WebM.' };
    if (S.backend.kind === 'cloud' && file.size > 20 * 1024 * 1024) throw { message: 'Vidéo trop lourde (20 Mo maximum) : compresse-la avant de l’ajouter.' };
    const poster = await videoPoster(file);
    const ref = await S.backend.putBlob(file, file.type);
    const pref = await S.backend.putBlob(poster.blob, 'image/jpeg');
    return { kind: 'video', ref, poster: pref, w: poster.w, h: poster.h };
  }
  throw { message: 'Type de fichier non pris en charge (images JPEG, PNG, WebP, SVG ou vidéos MP4, WebM).' };
}
function errText(e) {
  if (!e) return 'Erreur inconnue';
  const map = {
    too_large: 'Fichier trop lourd.', unsupported_type: 'Type de fichier refusé.', quota_or_state: 'Espace de stockage plein.',
    rate_limited: 'Trop de fichiers d’un coup : réessaie dans un instant.', not_granted: 'Ajout de fichiers indisponible ici.',
    store_unavailable: 'Stockage momentanément indisponible : réessaie.'
  };
  return map[e.code] || e.message || String(e);
}

/* ==========================================================================
   Rendu d'une page (édition, vignette, présentation, export).
   ========================================================================== */
function imgURL(ref) {
  if (!ref) return '';
  return S.backend ? S.backend.url(ref) : ref;
}

/* Recadrage : « remplir » (cover) ou « contenir », zoom et point de cadrage. */
function imgLayout(el, w = el.w, hh = el.h) {
  const nw = el.nw || 1000, nh = el.nh || 1000;
  const base = el.fit === 'contain' ? Math.min(w / nw, hh / nh) : Math.max(w / nw, hh / nh);
  const s = base * (el.zoom || 1);
  const bw = nw * s, bh = nh * s;
  const fx = el.fx == null ? 0.5 : el.fx, fy = el.fy == null ? 0.5 : el.fy;
  return { s, bw, bh, bx: (w - bw) * fx, by: (hh - bh) * fy };
}

function pageIndex(pid) { return S.meta ? S.meta.order.indexOf(pid) : 0; }

function renderPage(page, mode = 'edit', index = pageIndex(page.id)) {
  const dark = isDark(page.bg || '#FFFFFF');
  const pg = h('div', { class: `pg mode-${mode}${dark ? ' is-dark' : ''}`, 'data-pid': page.id });
  pg.style.background = page.bg || '#FFFFFF';
  for (const el of page.els) pg.append(renderEl(el, mode, page, index));
  pg.append(renderChrome(page, index, mode));
  return pg;
}

function renderChrome(page, index, mode) {
  const box = h('div', { class: 'chrome' });
  const ch = page.chrome || {};
  const dark = isDark(page.bg || '#FFFFFF');
  const col = dark ? '#BDBAB3' : '#6B6862';
  if (ch.header !== false && index > 0) {
    const chap = chapterOf(page.chapter);
    const label = `${(S.meta && S.meta.brand) || 'Sarments'} · ${chap.id === 'ouv' ? (page.name || '') : chap.name}`;
    box.append(h('div', { class: 'ch-head', style: { color: col } }, h('i', { class: 'tri', style: { borderLeftColor: dark ? '#FFFFFF' : C.ink } }), h('span', null, label)));
  }
  if (ch.folio !== false && index > 0) {
    box.append(h('div', { class: 'ch-folio', style: { color: col } }, String(index + 1).padStart(2, '0')));
  }
  return box;
}

function renderEl(el, mode, page, index) {
  const d = document.createElement('div');
  d.className = `el t-${el.t}`;
  d.dataset.id = el.id;
  const st = d.style;
  st.left = el.x + 'px';
  st.top = el.y + 'px';
  st.width = el.w + 'px';
  if (!(el.t === 'text' && el.autoH !== false)) st.height = el.h + 'px';
  if (el.r && mode !== 'export') st.transform = `rotate(${el.r}deg)`;
  if (el.o != null && el.o < 1) st.opacity = el.o;
  if (el.lock) d.classList.add('locked');
  const inn = document.createElement('div');
  inn.className = 'in';
  d.append(inn);
  switch (el.t) {
    case 'text': renderText(d, inn, el, page, index); break;
    case 'image': renderImage(d, inn, el, mode); break;
    case 'shape': renderShape(d, inn, el); break;
    case 'chart': inn.innerHTML = donutSVG(el); break;
    case 'draw': inn.innerHTML = drawSVG(el); break;
    case 'video': renderVideo(d, inn, el, mode); break;
  }
  if (mode === 'present' && el.anim && el.anim.type && el.anim.type !== 'none') {
    d.classList.add('anim', 'a-' + el.anim.type);
    d.style.setProperty('--d', (el.anim.delay || 0) + 'ms');
  }
  return d;
}

function renderText(d, inn, el, page, index) {
  const s = textStyle(el);
  const st = d.style;
  const dark = isDark(page.bg || '#FFFFFF');
  d.classList.add('st-' + (el.st || 'body'));
  st.fontFamily = STACK[s.ff] || STACK.serif;
  st.fontSize = s.fs + 'px';
  st.lineHeight = s.lh;
  st.letterSpacing = s.ls ? s.ls + 'em' : '0';
  st.fontWeight = s.fw >= 500 ? 600 : 400;
  st.fontStyle = s.it ? 'italic' : 'normal';
  st.textTransform = s.up ? 'uppercase' : 'none';
  st.textAlign = s.al || 'left';
  const onBox = s.box === 'sel' || (s.box === 'fill' && !isDark(s.bg || C.warm));
  st.color = s.col || (onBox ? C.ink : (dark ? '#FFFFFF' : C.ink));
  if (s.box === 'sel' || s.box === 'fill') {
    d.classList.add('box-' + s.box);
    st.backgroundColor = s.bg || (s.box === 'sel' ? C.sel : C.warm);
    st.padding = `${s.pad[0]}px ${s.pad[1]}px`;
  } else if (s.box === 'rule') {
    d.classList.add('box-rule');
    st.borderTop = `2px solid ${s.col || (dark ? '#FFFFFF' : C.ink)}`;
    st.paddingTop = '14px';
  }
  if (el.autoH === false) {
    d.classList.add('fixed-h');
    st.justifyContent = el.va === 'middle' ? 'center' : el.va === 'bottom' ? 'flex-end' : 'flex-start';
  }
  inn.className = 'in tx';
  inn.innerHTML = el.toc ? tocHTML(el) : (el.html || '');
}

function tocHTML() {
  if (!S.meta) return '';
  const seen = new Map();
  S.meta.order.forEach((pid, i) => {
    const p = S.pages.get(pid);
    if (!p) return;
    const ch = chapterOf(p.chapter);
    if (ch.toc === false || seen.has(ch.id)) return;
    seen.set(ch.id, i + 1);
  });
  return CHAPTERS.filter(c => seen.has(c.id)).map(c =>
    `<p class="toc-row"><span class="toc-n">${c.num || ''}</span><span class="toc-t">${esc(c.name)}</span><span class="toc-p">${String(seen.get(c.id)).padStart(2, '0')}</span></p>`
  ).join('');
}

function renderImage(d, inn, el, mode) {
  const url = imgURL(el.src);
  if (!url) {
    d.classList.add('empty');
    inn.className = 'in ph';
    inn.append(h('div', { class: 'ph-in' },
      h('span', { class: 'ph-ico', html: '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 16l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="15.5" cy="9" r="1.6" fill="currentColor"/></svg>' }),
      h('span', { class: 'ph-t' }, el.ph || 'Glisse une photo ici')));
    return;
  }
  inn.className = 'in im';
  if (mode === 'export') return;
  const L = imgLayout(el);
  const st = inn.style;
  st.backgroundImage = `url("${url}")`;
  st.backgroundSize = `${L.bw}px ${L.bh}px`;
  st.backgroundPosition = `${L.bx}px ${L.by}px`;
  if (el.gray) st.filter = 'grayscale(1)';
}

function renderShape(d, inn, el) {
  inn.className = 'in shp sh-' + (el.shape || 'rect');
  const st = inn.style;
  if (el.shape === 'tri') {
    st.background = el.fill || C.ink;
    return;
  }
  if (el.fill) st.background = el.fill;
  if (el.stroke && el.sw) st.border = `${el.sw}px solid ${el.stroke}`;
  if (el.shape === 'ellipse') st.borderRadius = '50%';
  else if (el.rad) st.borderRadius = el.rad + 'px';
}

function renderVideo(d, inn, el, mode) {
  inn.className = 'in vid';
  const src = imgURL(el.src), poster = imgURL(el.poster);
  if (mode === 'export' || !src) {
    if (!src) { d.classList.add('empty'); inn.className = 'in ph'; inn.append(h('div', { class: 'ph-in' }, h('span', { class: 'ph-t' }, 'Vidéo'))); }
    return;
  }
  const v = h('video', { muted: true, playsinline: true, preload: 'metadata', loop: el.loop !== false });
  v.muted = true;
  if (poster) v.poster = poster;
  v.src = src;
  v.style.objectPosition = `${(el.fx == null ? 0.5 : el.fx) * 100}% ${(el.fy == null ? 0.5 : el.fy) * 100}%`;
  v.style.objectFit = el.fit === 'contain' ? 'contain' : 'cover';
  if (mode === 'present') { v.autoplay = true; v.setAttribute('autoplay', ''); }
  inn.append(v);
  if (mode === 'edit' || mode === 'thumb') inn.append(h('span', { class: 'vid-badge', html: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.55)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>' }));
}

/* Graphique en anneau / camembert : mêmes rayons à l'écran et dans le PDF. */
function donutGeom(el) {
  const total = (el.data || []).reduce((a, d) => a + Math.max(0, +d.v || 0), 0) || 1;
  const hole = clamp(el.hole == null ? 0 : el.hole, 0, 0.9);
  const R = 50, ri = R * hole, mid = (R + ri) / 2, th = R - ri;
  let a = el.start == null ? -90 : el.start;
  const segs = (el.data || []).map(d => {
    const sweep = 360 * Math.max(0, +d.v || 0) / total;
    const seg = { a0: a, a1: a + sweep, c: d.c || C.ink };
    a += sweep;
    return seg;
  });
  return { R, mid, th, segs };
}
function donutSVG(el) {
  const g = donutGeom(el);
  const circ = 2 * Math.PI * g.mid;
  const parts = g.segs.map(s => {
    const len = circ * (s.a1 - s.a0) / 360;
    return `<circle cx="50" cy="50" r="${g.mid}" fill="none" stroke="${s.c}" stroke-width="${g.th}" stroke-dasharray="${len} ${circ}" transform="rotate(${s.a0} 50 50)"/>`;
  }).join('');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" aria-hidden="true">${parts}</svg>`;
}

/* Dessin à main levée : points normalisés (0 à 1) dans la boîte de l'élément. */
function drawPathD(el, w = el.w, hh = el.h) {
  const p = el.pts || [];
  let d = '';
  for (let i = 0; i < p.length; i += 2) d += (i ? 'L' : 'M') + round(p[i] * w, 1) + ' ' + round(p[i + 1] * hh, 1);
  return d;
}
function drawSVG(el) {
  return `<svg viewBox="0 0 ${el.w} ${el.h}" width="100%" height="100%" preserveAspectRatio="none" style="overflow:visible" aria-hidden="true"><path d="${drawPathD(el)}" fill="none" stroke="${el.stroke || C.ink}" stroke-width="${el.sw || 4}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function defaultAnim(st, html) {
  if (st === 'keep') return 'select';
  if ((st === 'h1' || st === 'h2' || st === 'cover' || st === 'lead' || st === 'quote') && /<mark/.test(html || '')) return 'select';
  if (st === 'h1' || st === 'h2' || st === 'cover' || st === 'num') return 'rise';
  if (st === 'lead' || st === 'quote' || st === 'body' || st === 'small' || st === 'h3') return 'fade';
  return 'none';
}
function T(html, x, y, w, st = 'body', o = {}) {
  const el = { id: uid(), t: 'text', x, y, w, h: o.h || 40, r: 0, o: 1, st, html: typo(html), autoH: !o.h };
  Object.assign(el, o);
  if (o.h) el.autoH = false;
  if (!el.anim) el.anim = { type: defaultAnim(st, el.html) };
  return el;
}
function I(img, x, y, w, hh, o = {}) {
  const base = typeof img === 'string' ? (IMG[img] || { src: '' }) : (img || { src: '' });
  return {
    id: uid(), t: 'image', x, y, w, h: hh, r: 0, o: 1, src: base.src || '', nw: base.nw || 0, nh: base.nh || 0,

  };
}
const FRAME = (text, x, y, w, hh, o = {}) => I(null, x, y, w, hh, { ph: typo(text), ...o });
function R(x, y, w, hh, fill, o = {}) {
  return { id: uid(), t: 'shape', shape: 'rect', x, y, w, h: hh, r: 0, o: 1, fill, stroke: null, sw: 0, rad: 0, anim: { type: 'none' }, ...o };
}
const ELL = (x, y, w, hh, fill, o = {}) => R(x, y, w, hh, fill, { shape: 'ellipse', ...o });
const LINE = (x, y, w, thick = 1.5, color = C.ink, o = {}) => R(x, y, w, thick, color, o);
function DONUT(x, y, size, data, o = {}) {
  return { id: uid(), t: 'chart', kind: 'donut', x, y, w: size, h: size, r: 0, o: 1, hole: 0, start: -90, data, anim: { type: 'zoom' }, ...o };
}
const KEEP = (text, x, y, w, o = {}) => T(text, x, y, w, 'keep', o);
function PAGE(chapter, beat, name, els, o = {}) {
  return {
    id: uid('p'), chapter, beat, name: typo(name), bg: o.bg || '#FFFFFF',

const TITLE = (a, b, x = 72, y = 96, w = 760, st = 'h2', o = {}) =>
  T(`<p>${a}</p><p class="ind"><mark class="sel">${b}</mark></p>`, x, y, w, st, o);
const LI = arr => arr.map(s => `<p class="li">${s}</p>`).join('');

/* ---------------------------------------------------------------- blocs réutilisés */
function opener(chapter, beat, num, a, b, list, bgEls = [], o = {}) {
  const dark = o.bg ? isDark(o.bg) : false;
  return PAGE(chapter, beat, 'Ouverture · ' + chapterOf(chapter).name, [

  ], { header: false, bg: o.bg, notes: o.notes });

function fiche(d) {
  const els = [
    T(d.type, 72, 96, 500, 'label'),
    T(d.name, 72, 124, 760, 'h2', { fs: 70 }),
    T(d.place, 72, 222, 760, 'small', { col: C.muted }),

    FRAME('Photo produit', 566, 300, 262, 308),

/* ---------------------------------------------------------------- utilitaires d'état */
const curPage = () => S.pages.get(S.cur);
const getEl = id => { const p = curPage(); return p ? p.els.find(e => e.id === id) : null; };
const elNode = id => UI.phost.querySelector(`.el[data-id="${id}"]`);
const canEdit = () => S.backend && S.backend.canWrite;
function elH(el) {
  if (el.t === 'text' && el.autoH !== false) {
    const n = elNode(el.id);
    if (n) { el.h = n.offsetHeight; }
  }
  return el.h;
}

/* ---------------------------------------------------------------- historique */
const HIST = { undo: [], redo: [], open: null };
function begin(pid = S.cur) {
  if (HIST.open && HIST.open.pid === pid) return;
  endHist();
  const p = S.pages.get(pid);
  if (p) HIST.open = { kind: 'page', pid, before: clone(p) };
}
function endHist() {
  const o = HIST.open;
  if (!o) return;
  HIST.open = null;
  const p = S.pages.get(o.pid);
  if (!p) return;
  const after = clone(p);
  if (same(after, o.before)) return;
  HIST.undo.push({ kind: 'page', pid: o.pid, before: o.before, after });
  HIST.redo.length = 0;
  if (HIST.undo.length > 120) HIST.undo.shift();
  refreshUndoButtons();
}
function snapStruct() {
  return { order: [...S.meta.order], pages: Object.fromEntries([...S.pages].map(([id, p]) => [id, clone(p)])) };
}
function structChange(fn) {
  endHist();
  const before = snapStruct();
  const r = fn();
  const after = snapStruct();
  HIST.undo.push({ kind: 'struct', before, after });
  HIST.redo.length = 0;
  refreshUndoButtons();
  return r;
}
function applyPageState(pid, state) {
  if (state) { S.pages.set(pid, clone(state)); markDirty(pid); }
  if (pid === S.cur) { S.sel = S.sel.filter(id => getEl(id)); renderStage(); }
  refreshThumb(pid);
}
function applyStruct(st) {
  for (const [id, p] of Object.entries(st.pages)) {
    const cur = S.pages.get(id);
    if (!cur || !same(cur, p)) { S.pages.set(id, clone(p)); markDirty(id); }
  }
  for (const id of [...S.pages.keys()]) if (!st.pages[id]) { S.pages.delete(id); deletePageNow(id); }
  S.meta.order = [...st.order];
  markMeta();
  if (!S.pages.has(S.cur)) S.cur = S.meta.order[0];
  S.sel = [];
  renderSidebar();
  renderStage();
}
function undo() {
  if (S.editing) exitEdit();
  endHist();
  const e = HIST.undo.pop();
  if (!e) return;
  if (e.kind === 'page') { if (S.cur !== e.pid && S.pages.has(e.pid)) goPage(e.pid); applyPageState(e.pid, e.before); }
  else applyStruct(e.before);
  HIST.redo.push(e);
  refreshUndoButtons();
  renderInspector();
}
function redo() {
  if (S.editing) exitEdit();
  endHist();
  const e = HIST.redo.pop();
  if (!e) return;
  if (e.kind === 'page') { if (S.cur !== e.pid && S.pages.has(e.pid)) goPage(e.pid); applyPageState(e.pid, e.after); }
  else applyStruct(e.after);
  HIST.undo.push(e);
  refreshUndoButtons();
  renderInspector();
}
function refreshUndoButtons() {
  if (!UI.undo) return;
  UI.undo.disabled = !HIST.undo.length && !HIST.open;
  UI.redo.disabled = !HIST.redo.length;
}
/* Modifie la page courante en une étape d'historique. */
function mutate(fn, opts = {}) {
  const p = curPage();
  if (!p || !canEdit()) return;
  begin(p.id);
  fn(p);
  endHist();
  markDirty(p.id);
  if (opts.render !== false) renderStage();
  refreshThumb(p.id);
  if (opts.inspector !== false) renderInspector();
}

  const node = elNode(el.id);
  const hh0 = elH(el);
  const o = { x: el.x, y: el.y, w: el.w, h: hh0, r: el.r || 0 };
  const c0 = { x: o.x + o.w / 2, y: o.y + o.h / 2 };

  const thr = 7 / S.zoom;

      if (dir.includes('w')) { const s = bestSnap([o.x + lx], targets.xs, thr); if (s) { lx += s.d; guides.x.push(s.t); } }
      if (dir.includes('s')) { const s = bestSnap([o.y + o.h + ly], targets.ys, thr); if (s) { ly += s.d; guides.y.push(s.t); } }
      if (dir.includes('n')) { const s = bestSnap([o.y + ly], targets.ys, thr); if (s) { ly += s.d; guides.y.push(s.t); } }

/* ---------------------------------------------------------------- dessin à main levée */
function penDown(e, pt) {
  const pts = [pt];
  const z = S.zoom;
  const svg = h('div', { class: 'penlive' });
  UI.ov.append(svg);
  const draw = () => {
    svg.innerHTML = `<svg width="${PW * z}" height="${PH * z}"><path d="${pts.map((p, i) => (i ? 'L' : 'M') + p.x * z + ' ' + p.y * z).join('')}" fill="none" stroke="${C.ink}" stroke-width="${4 * z}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  };
  const move = ev => { const cp = toPage(ev); const l = pts[pts.length - 1]; if (Math.hypot(cp.x - l.x, cp.y - l.y) > 1.5) { pts.push(cp); draw(); } };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    DRAG = null;
    svg.remove();
    if (pts.length < 2) return;
    const simp = simplify(pts, 1.2);
    const sw = 4, pad = sw;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of simp) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
    const w = Math.max(8, x1 - x0), hh = Math.max(8, y1 - y0);
    const flat = [];
    for (const p of simp) flat.push(round((p.x - x0) / w, 4), round((p.y - y0) / hh, 4));
    const el = { id: uid(), t: 'draw', x: Math.round(x0), y: Math.round(y0), w: Math.round(w), h: Math.round(hh), r: 0, o: 1, pts: flat, stroke: C.ink, sw, anim: { type: 'reveal' } };
    mutate(p => p.els.push(el), { inspector: false });
    S.sel = [el.id];
    drawOverlay(); renderInspector();
  };

  window.addEventListener('pointerup', up);
}
function simplify(pts, eps) {
  if (pts.length < 3) return pts;
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    let md = 0, mi = -1;
    const A = pts[a], B = pts[b];
    const L = Math.hypot(B.x - A.x, B.y - A.y) || 1;
    for (let i = a + 1; i < b; i++) {
      const d = Math.abs((B.x - A.x) * (A.y - pts[i].y) - (A.x - pts[i].x) * (B.y - A.y)) / L;
      if (d > md) { md = d; mi = i; }
    }
    if (md > eps && mi > 0) { keep[mi] = true; stack.push([a, mi], [mi, b]); }
  }
  return pts.filter((p, i) => keep[i]);
}

/* ---------------------------------------------------------------- édition de texte */
const ALLOWED = { P: ['li', 'ind', 'tight'], BR: [], B: [], STRONG: [], I: [], EM: [], MARK: ['sel'], SPAN: ['tag', 'up', 'down', 'mix', 'warn'] };
function sanitizeHTML(html) {
  const box = document.createElement('div');
  box.innerHTML = html;
  box.querySelectorAll('span[style*="background"]').forEach(sp => {
    const m = document.createElement('mark');
    m.className = 'sel';
    while (sp.firstChild) m.append(sp.firstChild);
    sp.replaceWith(m);
  });
  const walk = node => {
    for (const ch of [...node.childNodes]) {

      if (ch.nodeType !== 1) { ch.remove(); continue; }
      let tag = ch.tagName;
      if (tag === 'DIV') {
        const p = document.createElement('p');

        ch.replaceWith(p);
        walk(p);
        continue;
      }
      if (!(tag in ALLOWED)) {
        walk(ch);
        const frag = document.createDocumentFragment();
        while (ch.firstChild) frag.append(ch.firstChild);
        ch.replaceWith(frag);
        continue;
      }
      const cls = (ch.getAttribute('class') || '').split(/\s+/).filter(c => ALLOWED[tag].includes(c));
      for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
      if (cls.length) ch.setAttribute('class', cls.join(' '));
      if (tag === 'MARK' && !cls.includes('sel')) ch.className = 'sel';

    }
  };
  walk(box);
  box.querySelectorAll('mark mark').forEach(m => { const f = document.createDocumentFragment(); while (m.firstChild) f.append(m.firstChild); m.replaceWith(f); });

}
const isEmptyHTML = html => !html || !html.replace(/<[^>]+>/g, '').replace(/[\s  ]/g, '');

function enterEdit(id, clientX, clientY, selectAll) {

  if (!el || el.t !== 'text' || el.toc || !canEdit()) return;
  if (S.crop) exitCrop();
  begin();
  S.editing = id;
  S.sel = [id];
  const node = elNode(id);
  const tx = node.querySelector('.tx');

    if (S.editing) {
      if (e.key === 'Escape') { e.preventDefault(); exitEdit(); }
      else if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); toggleMark(); }
      else if (mod && (e.key.toLowerCase() === 'b' || e.key.toLowerCase() === 'i')) { setTimeout(onEditInput, 0); }
      return;
    }
    if (inField) { if (e.key === 'Escape') document.activeElement.blur(); return; }
    if (S.crop) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); exitCrop(); } return; }
    const k = e.key;
    if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod && k.toLowerCase() === 'd') { e.preventDefault(); if (S.sel.length && canEdit()) { begin(); duplicateSelection(true); endHist(); markDirty(S.cur); refreshThumb(S.cur); } return; }

    if (mod && k.toLowerCase() === 'a') { e.preventDefault(); S.sel = curPage().els.filter(x => !x.lock).map(x => x.id); drawOverlay(); renderInspector(); return; }
    if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomStep(1); return; }
    if (mod && k === '-') { e.preventDefault(); zoomStep(-1); return; }
    if (mod && k === '0') { e.preventDefault(); S.fit = true; layoutBoard(); return; }
    if (mod) return;
    if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
    if (k === 'Escape') { if (S.tool !== 'select') setTool('select'); else { S.sel = []; drawOverlay(); renderInspector(); } return; }

      const el = getEl(S.sel[0]);
      if (el && el.t === 'text') { e.preventDefault(); enterEdit(el.id, null, null, true); }
      else if (el && el.t === 'image' && el.src) { e.preventDefault(); enterCrop(el.id); }
      return;
    }
    if (k === 'PageDown' || (k === 'ArrowDown' && !S.sel.length)) { e.preventDefault(); goRel(1); return; }
    if (k === 'PageUp' || (k === 'ArrowUp' && !S.sel.length)) { e.preventDefault(); goRel(-1); return; }
    const map = { v: () => setTool('select'), t: () => toolAction('text'), i: () => toolAction('image'), r: () => toolAction('rect'), l: () => toolAction('line'), d: () => toolAction('pen'),
      g: () => $('#b-grid').click(), p: () => startPresent(S.meta.order.indexOf(S.cur)), ']': () => arrange('forward'), '[': () => arrange('backward'), '?': openHelp };

function distribute(axis) {
  const els = S.sel.map(getEl).filter(Boolean);
  if (els.length < 3) { toast('Sélectionne au moins trois éléments.'); return; }
  mutate(() => {
    const key = axis, size = axis === 'x' ? 'w' : 'h';
    const sorted = [...els].sort((a, b) => a[key] - b[key]);
    const first = sorted[0], last = sorted[sorted.length - 1];
    const total = sorted.reduce((s, e) => s + (size === 'h' ? elH(e) : e.w), 0);
    const span = (last[key] + (size === 'h' ? elH(last) : last.w)) - first[key];
    const gap = (span - total) / (sorted.length - 1);
    let pos = first[key];
    for (const e of sorted) { e[key] = Math.round(pos); pos += (size === 'h' ? elH(e) : e.w) + gap; }
  });
}

/* ---------------------------------------------------------------- sauvegardes */
async function saveFile(filename, blob) {
  if (CAP.downloads) {
    try { await CAP.downloads.save({ filename, data: blob }); return 'saved'; }
    catch (e) {
      if (e && e.code === 'declined') return 'declined';
      if (e && (e.code === 'rate_limited')) { toast('Un enregistrement est déjà en attente.', 'warn'); return 'busy'; }
      if (e && e.code === 'too_large') { toast('Fichier trop lourd pour cette destination : choisis une qualité plus légère.', 'warn', 6000); return 'too_large'; }
    }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return 'saved';
}
async function exportBackup() {
  const pages = S.meta.order.map(id => clone(S.pages.get(id))).filter(Boolean);
  // les images gardées dans le navigateur sont intégrées au fichier
  for (const p of pages) for (const el of p.els) for (const k of ['src', 'poster']) {
    const ref = el[k];
    if (ref && /^(idb|mem):/.test(ref)) {
      try { const b = await (await fetch(imgURL(ref))).blob(); el[k] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); } catch (e) {}
    }
  }
  const data = JSON.stringify({ app: 'sarments-editeur', v: 1, savedAt: new Date().toISOString(), meta: S.meta, pages });
  const name = 'sarments-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json';
  const r = await saveFile(name, new Blob([data], { type: 'application/json' }));
  if (r === 'saved') toast('Sauvegarde enregistrée.');
}
function importBackup() {
  const inp = $('#jsonin');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.pages) || !data.meta) throw new Error('format');
      confirmBox('Remplacer le dossier par cette sauvegarde ?', `${data.pages.length} pages, enregistrées le ${new Date(data.savedAt || Date.now()).toLocaleDateString('fr-FR')}.`, 'Remplacer', async () => {
        const tk = toastProgress('Import de la sauvegarde…');
        for (const p of data.pages) for (const el of p.els) for (const k of ['src', 'poster']) {
          if (el[k] && el[k].startsWith('data:')) {
            try { const b = await (await fetch(el[k])).blob(); el[k] = await S.backend.putBlob(b, b.type); } catch (e) { el[k] = ''; }
          }
        }
        structChange(() => {
          for (const id of [...S.pages.keys()]) { S.pages.delete(id); deletePageNow(id); }
          for (const p of data.pages) { S.pages.set(p.id, p); markDirty(p.id); }
          S.meta = { ...data.meta, order: data.pages.map(p => p.id) };
          markMeta();
        });
        tk();
        openProject();
        toast('Sauvegarde importée.');
      });
    } catch (e) { toast('Ce fichier n’est pas une sauvegarde de l’éditeur.', 'warn'); }
  };
  inp.click();
}

let _tplCount = 0;
function templateCount() { return _tplCount || (_tplCount = buildDossier().pages.length); }
async function createFromTemplate(reset) {
  if (!canEdit()) return;
  const btns = $$('#onboard button');
  btns.forEach(b => { b.disabled = true; });
  const { meta, pages } = buildDossier();
  if (reset) {
    structChange(() => {
      for (const id of [...S.pages.keys()]) { S.pages.delete(id); deletePageNow(id); }
      for (const p of pages) S.pages.set(p.id, p);
      S.meta = { ...meta, title: (S.meta && S.meta.title) || meta.title };
    });
  } else {
    S.meta = meta;
    for (const p of pages) S.pages.set(p.id, p);
  }
  showOnboard('creating');
  const lab = $('#onboard .ob-wait');
  let done = 0;
  const queue = [...pages];
  const worker = async () => {
    while (queue.length) {
      const p = queue.shift();
      try { await S.backend.savePage(cleanPage(p)); } catch (e) { SAVE.pages.add(p.id); }
      done++;
      if (lab) lab.lastChild.textContent = `Création des pages… ${done} / ${pages.length}`;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  try { await S.backend.saveMeta(clone(S.meta)); } catch (e) { SAVE.meta = true; }
  if (SAVE.pages.size || SAVE.meta) scheduleSave(500);
  openProject();
}

function openProject() {
  // l'ordre ne garde que les pages présentes, puis ajoute les pages orphelines
  const order = (S.meta.order || []).filter(id => S.pages.has(id));
  for (const id of S.pages.keys()) if (!order.includes(id)) order.push(id);
  S.meta.order = order;
  if (!S.pages.has(S.cur)) S.cur = order[0];
  $('#onboard').hidden = true;
  UI.app.hidden = false;
  UI.ptitle.value = S.meta.title || 'Dossier';
  setSaveState(S.backend.canWrite ? 'saved' : 'readonly');
  renderSidebar();
  S.fit = true;
  renderStage();
  renderInspector();
  refreshUndoButtons();
}
function onRemoteMeta(meta) {
  if (SAVE.meta || SAVE.busy) return;
  if (S.meta && same(meta, S.meta)) return;
  if (S.editing || DRAG || S.crop) return;
  const keepZoom = !UI.app.hidden;
  S.meta = meta;
  if (!S.pages.size) return;
  if (keepZoom) {
    S.meta.order = (S.meta.order || []).filter(id => S.pages.has(id));
    if (!S.pages.has(S.cur)) S.cur = S.meta.order[0];
    UI.ptitle.value = S.meta.title || 'Dossier';
    renderSidebar();
    renderStage();
    renderInspector();
  } else openProject();
}
function onRemotePage(page) {
  const local = S.pages.get(page.id);
  const recent = Date.now() - (SAVE.lastLocal[page.id] || 0) < 5000;
  if (SAVE.pages.has(page.id) || recent) return;
  if (local && same({ ...local, updatedAt: 0 }, { ...page, updatedAt: 0 })) return;
  if (S.cur === page.id && (S.editing || DRAG || S.crop)) return;
  S.pages.set(page.id, page);
  if (UI.app.hidden || !S.meta) return;
  if (!S.meta.order.includes(page.id)) return;
  if (S.cur === page.id) { renderStage(); renderInspector(); }
  refreshThumb(page.id);
}
function onRemoteRemove(id) {
  if (!S.pages.has(id) || (S.meta && S.meta.order.includes(id))) return;
  S.pages.delete(id);
}

async function boot() {
  await loadFonts();
  buildShell();
  showOnboard('loading');
  S.backend = await pickBackend();
  let data = { meta: null, pages: [] };
  try { data = await S.backend.loadAll(); }
  catch (e) { toast('Chargement impossible : ' + errText(e), 'warn', 6000); }
  for (const p of data.pages) if (p && p.id && Array.isArray(p.els)) S.pages.set(p.id, p);
  if (data.meta && S.pages.size) { S.meta = data.meta; openProject(); }
  else if (!data.meta && S.pages.size) { S.meta = { title: 'Dossier', brand: 'Sarments', order: [...S.pages.keys()], v: 1 }; openProject(); }
  else showOnboard('empty');
  S.backend.subscribe(onRemoteMeta, onRemotePage, onRemoteRemove);
  if (S.backend.kind === 'memory') toast('Enregistrement indisponible dans ce navigateur : utilise « Sauvegarde du projet ».', 'warn', 7000);
}

  root.removeEventListener('click', prClick);
  root.removeEventListener('pointermove', prWake);
  window.removeEventListener('resize', prFit);
  document.removeEventListener('fullscreenchange', prFit);
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  root.querySelectorAll('video').forEach(v => v.pause());
  root.hidden = true;

  PR.root = null;

}
function prKey(e) {

function prClick(e) {

function prShow(i, dir) {

  // décalage automatique des apparitions, dans l'ordre des calques

  for (const el of page.els) {

    const n = dom.querySelector(`.el[data-id="${el.id}"]`);

  wrap.classList.add('tr-' + tr, dir < 0 ? 'back' : 'fwd', 'enter');

  const old = PR.cur;

  wrap.querySelectorAll('video').forEach(v => { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); });
  PR.count.textContent = `${String(i + 1).padStart(2, '0')} / ${String(S.meta.order.length).padStart(2, '0')}`;
  PR.prog.firstChild.style.width = ((i + 1) / S.meta.order.length * 100) + '%';
  // précharge les images de la page suivante
  const nx = S.pages.get(S.meta.order[i + 1]);
  if (nx) for (const el of nx.els) if ((el.t === 'image' || el.t === 'video') && (el.src || el.poster)) { const im = new Image(); im.src = imgURL(el.t === 'video' ? el.poster : el.src); }
}

/* ==========================================================================
   Export PDF : une page A3 paysage par page du dossier.
   Le texte est vectoriel (mêmes polices, positions mesurées à l'écran),
   les images sont recadrées puis compressées à la résolution choisie.
   ========================================================================== */
const QUALITY = {
  light: { label: 'Léger', dpi: 110, q: 0.72, hint: 'Envoi par mail, dépôt en ligne' },
  standard: { label: 'Standard', dpi: 160, q: 0.8, hint: 'Lecture à l’écran, projection' },
  print: { label: 'Impression', dpi: 240, q: 0.88, hint: 'Impression A3' }

const JSPDF_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'

const PDFSTYLE = { n4: 'normal', n6: 'bold', i4: 'italic', i6: 'bolditalic' };
const MM = v => v / PXMM;
const K_PT = 72 / 25.4;

function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    s.onload = res;
    s.onerror = () => { s.remove(); rej(new Error('load')); };
    document.head.append(s);
  });
}
async function loadJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  for (const u of JSPDF_URLS) {
    try { await loadScript(u); if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF; } catch (e) { /* source suivante */ }
  }
  throw new Error('Le moteur PDF n’a pas pu être chargé. Vérifie ta connexion et réessaie.');
}

/* ---------------------------------------------------------------- fenêtre d'export */

function parseRange(txt, n) {
  const out = new Set();
  for (const part of String(txt).split(/[,;\s]+/)) {
    if (!part) continue;
    const m = /^(\d+)(?:-(\d+))?$/.exec(part);
    if (!m) continue;
    let a = +m[1], b = m[2] ? +m[2] : a;
    if (a > b) [a, b] = [b, a];
    for (let i = Math.max(1, a); i <= Math.min(n, b); i++) out.add(i - 1);
  }
  return [...out].sort((a, b) => a - b);
}
async function runExport(st, body) {
  const order = S.meta.order;

      h('p', { class: 'msub' }, `${idx.length} page${idx.length > 1 ? 's' : ''} · ${mo} Mo · ${q.label}`),

  } finally {

/* ---------------------------------------------------------------- moteur */
function registerPdfFonts(pdf) {
  for (const F of Object.values(FAM)) {
    for (const [key, file] of Object.entries(F.files)) {
      if (!FONTDATA[file]) continue;
      pdf.addFileToVFS(file + '.ttf', FONTDATA[file]);
      pdf.addFont(file + '.ttf', F.pdf, PDFSTYLE[key], 'Identity-H');
    }
  }
}
function setFill(pdf, c) { const v = Array.isArray(c) ? c : hexToRgb(c); pdf.setFillColor(v[0], v[1], v[2]); }
function setStroke(pdf, c) { const v = Array.isArray(c) ? c : hexToRgb(c); pdf.setDrawColor(v[0], v[1], v[2]); }

async function buildPDF(pids, opts, progress) {
  const jsPDF = await loadJsPDF();
  const pdf = new jsPDF({ unit: 'mm', format: [420, 297], orientation: 'landscape', compress: true, putOnlyUsedFonts: true });
  registerPdfFonts(pdf);
  pdf.setProperties({ title: (S.meta.title || 'Dossier'), creator: 'Éditeur Sarments' });
  const host = $('#xhost');
  const ctx = { pdf, opts, imgs: new Map(), parts: new Map(), alias: 0 };
  for (let n = 0; n < pids.length; n++) {
    const page = S.pages.get(pids[n]);
    if (n > 0) pdf.addPage([420, 297], 'landscape');
    const dom = renderPage(page, 'export', S.meta.order.indexOf(page.id));
    host.replaceChildren(dom);
    await document.fonts.ready;
    await nextFrame();
    ctx.pr = dom.getBoundingClientRect();
    const bg = (page.bg || '#FFFFFF').toUpperCase();
    if (bg !== '#FFFFFF') { setFill(pdf, bg); pdf.rect(0, 0, 420, 297, 'F'); }
    for (const el of page.els) {
      const node = dom.querySelector(`.el[data-id="${el.id}"]`);
      if (node) { try { await drawElement(ctx, el, node); } catch (e) { console.warn('élément ignoré', el.id, e); } }
    }
    const chrome = dom.querySelector('.chrome');
    if (chrome) {
      const tri = chrome.querySelector('.tri');
      if (tri) {
        const r = tri.getBoundingClientRect(), x = r.left - ctx.pr.left, y = r.top - ctx.pr.top;
        setFill(pdf, cssColorToRgba(getComputedStyle(tri).borderLeftColor) || [20, 20, 20]);
        pdf.triangle(MM(x), MM(y), MM(x), MM(y + r.height), MM(x + r.width), MM(y + r.height / 2), 'F');
      }
      drawWords(ctx, chrome);
    }
    progress(n + 1, pids.length);
    if (n % 4 === 3) await sleep(0);
  }
  host.innerHTML = '';
  return pdf.output('blob');
}

function rotateAround(pdf, cxmm, cymm, deg) {
  const H = 297 * K_PT, X = cxmm * K_PT, Y = H - cymm * K_PT, phi = -deg * Math.PI / 180;
  const c = Math.cos(phi), s = Math.sin(phi);
  const e = X - X * c + Y * s, f = Y - X * s - Y * c;
  pdf.internal.write([c, s, -s, c, e, f].map(v => v.toFixed(6)).join(' ') + ' cm');
}

async function drawElement(ctx, el, node) {
  const { pdf } = ctx;
  const r = node.getBoundingClientRect();
  const x = r.left - ctx.pr.left, y = r.top - ctx.pr.top, w = r.width, hh = r.height;
  const op = el.o == null ? 1 : el.o;
  const rot = el.r || 0;
  const scoped = op < 1 || rot;
  if (scoped) pdf.saveGraphicsState();
  if (op < 1) pdf.setGState(new pdf.GState({ opacity: op, 'stroke-opacity': op }));
  if (rot) rotateAround(pdf, MM(x + w / 2), MM(y + hh / 2), rot);
  switch (el.t) {
    case 'shape': drawShape(ctx, el, x, y, w, hh); break;
    case 'image': await drawImage(ctx, el, x, y, w, hh); break;
    case 'video': await drawImage(ctx, { ...el, src: el.poster, zoom: 1, ph: 'Vidéo' }, x, y, w, hh); break;
    case 'chart': drawDonut(ctx, el, x, y, w, hh); break;
    case 'draw': drawPen(ctx, el, x, y, w, hh); break;
    case 'text': drawText(ctx, el, node, x, y, w, hh); break;
  }
  if (scoped) pdf.restoreGraphicsState();
}

function drawShape(ctx, el, x, y, w, hh) {
  const pdf = ctx.pdf;
  if (el.shape === 'tri') {
    if (!el.fill) return;
    setFill(pdf, el.fill);
    pdf.triangle(MM(x + w / 2), MM(y), MM(x + w), MM(y + hh), MM(x), MM(y + hh), 'F');
    return;
  }
  const sw = el.stroke && el.sw ? el.sw : 0;
  const style = el.fill && sw ? 'FD' : el.fill ? 'F' : sw ? 'S' : null;
  if (!style) return;
  if (el.fill) setFill(pdf, el.fill);
  if (sw) { setStroke(pdf, el.stroke); pdf.setLineWidth(MM(sw)); }
  const ins = sw / 2;
  const X = MM(x + ins), Y = MM(y + ins), W = MM(Math.max(0.1, w - sw)), Hh = MM(Math.max(0.1, hh - sw));
  if (el.shape === 'ellipse') pdf.ellipse(MM(x + w / 2), MM(y + hh / 2), W / 2, Hh / 2, style);
  else if (el.rad) { const rr = MM(Math.min(el.rad, w / 2, hh / 2)); pdf.roundedRect(X, Y, W, Hh, rr, rr, style); }
  else pdf.rect(X, Y, W, Hh, style);
}

async function loadImageCached(ctx, url) {
  if (ctx.imgs.has(url)) return ctx.imgs.get(url);
  const p = loadImg(url).then(async img => {
    try { await img.decode(); } catch (e) {}
    let alpha = false;
    try {
      const c = document.createElement('canvas');
      c.width = 32; c.height = 32;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, 32, 32);
      const d = x.getImageData(0, 0, 32, 32).data;
      for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { alpha = true; break; }
    } catch (e) {}
    return { img, alpha };
  });
  ctx.imgs.set(url, p);
  return p;
}
function grayscaleCanvas(c) {
  const x = c.getContext('2d');
  const d = x.getImageData(0, 0, c.width, c.height);
  const a = d.data;
  for (let i = 0; i < a.length; i += 4) { const v = 0.2126 * a[i] + 0.7152 * a[i + 1] + 0.0722 * a[i + 2]; a[i] = a[i + 1] = a[i + 2] = v; }

async function drawImage(ctx, el, x, y, w, hh) {
  const pdf = ctx.pdf;
  if (!el.src) { if (ctx.opts.empty) drawPlaceholder(ctx, el, x, y, w, hh); return; }
  let res;
  try { res = await loadImageCached(ctx, imgURL(el.src)); } catch (e) { if (ctx.opts.empty) drawPlaceholder(ctx, el, x, y, w, hh); return; }
  const { img, alpha } = res;
  const nw = img.naturalWidth || el.nw || 1000, nh = img.naturalHeight || el.nh || 1000;
  const L = imgLayout({ ...el, nw, nh }, w, hh);
  const vx0 = Math.max(0, L.bx), vy0 = Math.max(0, L.by), vx1 = Math.min(w, L.bx + L.bw), vy1 = Math.min(hh, L.by + L.bh);
  if (vx1 - vx0 < 0.5 || vy1 - vy0 < 0.5) return;
  const sx = (vx0 - L.bx) / L.s, sy = (vy0 - L.by) / L.s, sw = (vx1 - vx0) / L.s, sh = (vy1 - vy0) / L.s;
  const dw = MM(vx1 - vx0), dh = MM(vy1 - vy0);
  let cw = Math.round(dw / 25.4 * ctx.opts.dpi), ch = Math.round(dh / 25.4 * ctx.opts.dpi);
  const k = Math.min(1, sw / cw, sh / ch);
  cw = Math.max(1, Math.round(cw * k)); ch = Math.max(1, Math.round(ch * k));
  const key = [el.src, sx, sy, sw, sh, cw, ch, el.gray ? 1 : 0].map(v => typeof v === 'number' ? Math.round(v) : v).join('|');
  let part = ctx.parts.get(key);
  if (!part) {
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const x2 = c.getContext('2d');
    x2.imageSmoothingEnabled = true;
    x2.imageSmoothingQuality = 'high';
    if (!alpha) { x2.fillStyle = '#FFFFFF'; x2.fillRect(0, 0, cw, ch); }
    x2.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    if (el.gray) grayscaleCanvas(c);
    part = alpha
      ? { data: c, fmt: 'PNG', alias: 'im' + (ctx.alias++), comp: 'FAST' }
      : { data: c.toDataURL('image/jpeg', ctx.opts.q), fmt: 'JPEG', alias: 'im' + (ctx.alias++), comp: 'NONE' };

}
function drawPlaceholder(ctx, el, x, y, w, hh) {
  const pdf = ctx.pdf;

  setStroke(pdf, '#C9C2B6');
  pdf.setLineWidth(0.4);
  pdf.setLineDashPattern([2, 1.5], 0);
  pdf.rect(MM(x), MM(y), MM(w), MM(hh), 'FD');
  pdf.setLineDashPattern([], 0);
  if (el.ph) {
    pdf.setFont(FAM.sans.pdf, 'normal');
    pdf.setFontSize(9);
    pdf.setTextColor(138, 131, 120);
    const lines = pdf.splitTextToSize(el.ph, Math.max(20, MM(w) - 10));
    pdf.text(lines, MM(x + w / 2), MM(y + hh / 2), { align: 'center', baseline: 'middle' });
  }

function arcBeziers(cxm, cym, r, a0, a1) {
  const pt = deg => { const t = deg * Math.PI / 180; return { x: cxm + r * Math.cos(t), y: cym + r * Math.sin(t) }; };
  const start = pt(a0);
  const list = [];
  let a = a0, cur = start;
  while (a < a1 - 1e-6) {
    const b = Math.min(a + 90, a1);
    const kk = 4 / 3 * Math.tan((b - a) * Math.PI / 720);
    const p0 = pt(a), p3 = pt(b);
    const ra = a * Math.PI / 180, rb = b * Math.PI / 180;
    const c1 = { x: p0.x - kk * r * Math.sin(ra), y: p0.y + kk * r * Math.cos(ra) };
    const c2 = { x: p3.x + kk * r * Math.sin(rb), y: p3.y - kk * r * Math.cos(rb) };
    list.push([c1.x - cur.x, c1.y - cur.y, c2.x - cur.x, c2.y - cur.y, p3.x - cur.x, p3.y - cur.y]);
    cur = p3;
    a = b;
  }
  return { x0: start.x, y0: start.y, list };
}
function drawDonut(ctx, el, x, y, w, hh) {
  const pdf = ctx.pdf;
  const g = donutGeom(el);
  const size = Math.min(w, hh), sc = size / 100;
  const cxp = x + w / 2, cyp = y + hh / 2;
  pdf.setLineCap('butt');
  for (const s of g.segs) {
    if (s.a1 - s.a0 < 0.05) continue;
    setStroke(pdf, s.c);
    pdf.setLineWidth(MM(g.th * sc));
    const arc = arcBeziers(MM(cxp), MM(cyp), MM(g.mid * sc), s.a0, s.a1);
    pdf.lines(arc.list, arc.x0, arc.y0, [1, 1], 'S', false);
  }
}
function drawPen(ctx, el, x, y, w, hh) {
  const pdf = ctx.pdf;
  const p = el.pts || [];
